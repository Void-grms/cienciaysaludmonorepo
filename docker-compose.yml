version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lis_postgres
    environment:
      POSTGRES_USER: lis_app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lis
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lis_app -d lis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lis_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: lis_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
