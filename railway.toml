[build]
buildCommand = "rm -rf packages/contracts/dist node_modules/@lis/contracts backend/dist backend/tsconfig.build.tsbuildinfo && find . -name '*.tsbuildinfo' -not -path './node_modules/*' -delete 2>/dev/null; npm install && npm run build --workspace=packages/contracts && echo '=== contracts dist ===' && ls -la packages/contracts/dist && echo '=== before cp: state of node_modules/@lis/contracts ===' && ls -la node_modules/@lis/ 2>/dev/null || echo '(no @lis dir)' && rm -rf node_modules/@lis/contracts && mkdir -p node_modules/@lis && cp -rL packages/contracts node_modules/@lis/contracts && echo '=== after cp: node_modules/@lis/contracts/dist ===' && ls -la node_modules/@lis/contracts/dist && npm run build --workspace=backend && echo '=== backend/dist tree ===' && find backend/dist -maxdepth 3 -type f | head -30 && if [ ! -f backend/dist/main.js ]; then echo '!!! FATAL: backend/dist/main.js was NOT emitted. Full tree:' && find backend/dist -type f && exit 1; fi && cd backend && npx prisma generate"

[deploy]
startCommand = "cd backend && npx prisma db push --skip-generate && npm run start:prod"
